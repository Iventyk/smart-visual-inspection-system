[project]
name = "smart-visual-inspection-system"
version = "0.1.0"
description = "Smart Visual Inspection System with FastAPI, Celery, OpenCV, and PyTorch"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.30",
  "asyncpg>=0.29.0",
  "alembic>=1.13.1",
  "pydantic-settings>=2.3.1",
  "email-validator>=2.2.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt==4.0.1",
  "celery>=5.4.0",
  "redis>=5.0.4",
  "numpy>=1.26.0",
  "opencv-python-headless>=4.10.0.84",
  "torch>=2.3.0",
  "torchvision>=0.18.0",
  "Pillow>=10.3.0",
  "structlog>=24.2.0",
  "slowapi>=0.1.9",
  "httpx>=0.27.0",
  "boto3>=1.34.131"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.7",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "black>=24.4.2",
]

[tool.black]
line-length = 79
target-version = ["py311"]

[tool.ruff]
line-length = 79

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing"
asyncio_mode = "auto"
